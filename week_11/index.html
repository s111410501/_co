<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nand2Tetris VM Translator</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d8dee9;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --danger: #b91c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      line-height: 1.5;
    }

    .header {
      padding: 32px 24px 12px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 24px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .badge {
      background: #e0e7ff;
      color: var(--accent-dark);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
    }

    .drop-zone {
      border: 2px dashed var(--line);
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color 0.15s, background 0.15s;
    }

    .drop-zone:hover,
    .drop-zone.dragging {
      border-color: var(--accent);
      background: #eff6ff;
    }

    .drop-zone span {
      color: var(--muted);
      font-size: 13px;
    }

    .row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
    }

    input[type="text"],
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      color: var(--text);
      background: #fff;
    }

    textarea {
      min-height: 320px;
      resize: vertical;
      font-family: "Cascadia Code", Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .checkbox input {
      width: 16px;
      height: 16px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 16px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent-dark);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
      color: #fff;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .error {
      color: var(--danger);
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
    }

    footer {
      max-width: 1200px;
      margin: 0 auto 32px;
      padding: 0 24px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }

      textarea {
        min-height: 240px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Nand2Tetris VM Translator</h1>
    <p>單一 HTML 檔，可放到任何靜態伺服器；在瀏覽器中將 .vm 翻譯成 Hack assembly。</p>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-head">
        <h2>輸入 VM 程式</h2>
        <span class="badge">.vm</span>
      </div>

      <div id="drop-zone" class="drop-zone">
        <strong>拖曳 .vm 檔案到這裡</strong>
        <span>或點擊選擇檔案，可一次選擇多個檔案</span>
      </div>
      <input id="file-input" type="file" accept=".vm" multiple hidden>

      <div class="row">
        <label for="file-name">檔案名稱（影響 static 符號）</label>
        <input id="file-name" type="text" value="Main.vm" spellcheck="false">
      </div>

      <label class="checkbox">
        <input id="bootstrap" type="checkbox">
        <span>加入 bootstrap（SP=256，呼叫 Sys.init）</span>
      </label>

      <label for="vm-text">或直接貼上 VM 程式碼</label>
      <textarea id="vm-text" spellcheck="false" placeholder="push constant 7&#10;push constant 8&#10;add">push constant 7
push constant 8
add</textarea>

      <button id="translate-button" class="primary" type="button">翻譯成 .asm</button>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>輸出 Hack Assembly</h2>
        <span id="status" class="status"></span>
      </div>

      <textarea id="output" spellcheck="false" readonly placeholder="翻譯結果會顯示在這裡"></textarea>

      <div id="error" class="error" role="alert" hidden></div>

      <div class="actions">
        <button id="copy-button" type="button">複製</button>
        <button id="download-button" type="button">下載 .asm</button>
      </div>
    </section>
  </main>

  <footer>
    支援 add/sub/neg/eq/gt/lt/and/or/not、push/pop、label/goto/if-goto、function/call/return。
    產生的 .asm 仍須用 Nand2Tetris Assembler 組譯成 .hack。
  </footer>

  <script>
    const C_ARITHMETIC = "C_ARITHMETIC";
    const C_PUSH = "C_PUSH";
    const C_POP = "C_POP";
    const C_LABEL = "C_LABEL";
    const C_GOTO = "C_GOTO";
    const C_IF = "C_IF";
    const C_FUNCTION = "C_FUNCTION";
    const C_RETURN = "C_RETURN";
    const C_CALL = "C_CALL";

    const ARITHMETIC_COMMANDS = new Set([
      "add", "sub", "neg", "eq", "gt", "lt", "and", "or", "not",
    ]);

    const SEGMENT_POINTERS = {
      local: "LCL",
      argument: "ARG",
      this: "THIS",
      that: "THAT",
    };

    class Parser {
      constructor(text) {
        this.lines = text
          .split(/\r?\n/)
          .map((line) => line.split("//", 1)[0].trim())
          .filter(Boolean);
        this.index = -1;
        this.tokens = [];
      }

      hasMoreLines() {
        return this.index + 1 < this.lines.length;
      }

      advance() {
        if (!this.hasMoreLines()) {
          throw new Error("No more lines to advance.");
        }
        this.index += 1;
        this.tokens = this.lines[this.index].split(/\s+/);
      }

      commandType() {
        const command = this.tokens[0];
        if (ARITHMETIC_COMMANDS.has(command)) return C_ARITHMETIC;
        switch (command) {
          case "push": return C_PUSH;
          case "pop": return C_POP;
          case "label": return C_LABEL;
          case "goto": return C_GOTO;
          case "if-goto": return C_IF;
          case "function": return C_FUNCTION;
          case "return": return C_RETURN;
          case "call": return C_CALL;
          default: throw new Error(`Unknown VM command: ${command}`);
        }
      }

      arg1() {
        const type = this.commandType();
        if (type === C_RETURN) {
          throw new Error("arg1() cannot be called for C_RETURN.");
        }
        if (type === C_ARITHMETIC) {
          return this.tokens[0];
        }
        if (this.tokens.length < 2) {
          throw new Error(`Missing argument for ${this.tokens[0]}`);
        }
        return this.tokens[1];
      }

      arg2() {
        const type = this.commandType();
        if (![C_PUSH, C_POP, C_FUNCTION, C_CALL].includes(type)) {
          throw new Error(`arg2() is invalid for command type ${type}.`);
        }
        const value = Number(this.tokens[2]);
        if (!Number.isInteger(value) || value < 0) {
          throw new Error(`Invalid numeric argument: ${this.tokens[2]}`);
        }
        return value;
      }
    }

    class CodeWriter {
      constructor({ bootstrap = false } = {}) {
        this.out = [];
        this.fileName = "";
        this.currentFunction = "";
        this.cmpCounter = 0;
        this.retCounter = 0;
        if (bootstrap) {
          this.writeInit();
        }
      }

      setFileName(name) {
        this.fileName = name.replace(/\.[^.]*$/, "");
      }

      emit(...lines) {
        this.out.push(...lines);
      }

      asm() {
        return this.out.length ? `${this.out.join("\n")}\n` : "";
      }

      pushD() {
        this.emit("@SP", "A=M", "M=D", "@SP", "M=M+1");
      }

      popToD() {
        this.emit("@SP", "AM=M-1", "D=M");
      }

      scopedLabel(label) {
        return this.currentFunction ? `${this.currentFunction}$${label}` : label;
      }

      writeInit() {
        this.emit("// Bootstrap code", "@256", "D=A", "@SP", "M=D");
        this.writeCall("Sys.init", 0);
      }

      writeArithmetic(command) {
        this.emit(`// ${command}`);
        if (command === "add") {
          this.popToD();
          this.emit("A=A-1", "M=D+M");
        } else if (command === "sub") {
          this.popToD();
          this.emit("A=A-1", "M=M-D");
        } else if (command === "and") {
          this.popToD();
          this.emit("A=A-1", "M=D&M");
        } else if (command === "or") {
          this.popToD();
          this.emit("A=A-1", "M=D|M");
        } else if (command === "neg") {
          this.emit("@SP", "A=M-1", "M=-M");
        } else if (command === "not") {
          this.emit("@SP", "A=M-1", "M=!M");
        } else if (["eq", "gt", "lt"].includes(command)) {
          const jump = { eq: "JEQ", gt: "JGT", lt: "JLT" }[command];
          const index = this.cmpCounter++;
          const trueLabel = `CMP_TRUE_${index}`;
          const endLabel = `CMP_END_${index}`;
          this.popToD();
          this.emit(
            "A=A-1",
            "D=M-D",
            `@${trueLabel}`,
            `D;${jump}`,
            "@SP",
            "A=M-1",
            "M=0",
            `@${endLabel}`,
            "0;JMP",
            `(${trueLabel})`,
            "@SP",
            "A=M-1",
            "M=-1",
            `(${endLabel})`,
          );
        } else {
          throw new Error(`Unknown arithmetic command: ${command}`);
        }
      }

      writePushPop(command, segment, index) {
        const op = command === C_PUSH ? "push" : "pop";
        this.emit(`// ${op} ${segment} ${index}`);

        if (command === C_PUSH) {
          if (segment === "constant") {
            this.emit(`@${index}`, "D=A");
          } else if (Object.prototype.hasOwnProperty.call(SEGMENT_POINTERS, segment)) {
            const base = SEGMENT_POINTERS[segment];
            this.emit(`@${base}`, "D=M", `@${index}`, "A=D+A", "D=M");
          } else if (segment === "temp") {
            this.emit(`@${5 + index}`, "D=M");
          } else if (segment === "pointer") {
            const target = index === 0 ? "THIS" : "THAT";
            this.emit(`@${target}`, "D=M");
          } else if (segment === "static") {
            this.emit(`@${this.fileName}.${index}`, "D=M");
          } else {
            throw new Error(`Unknown memory segment: ${segment}`);
          }
          this.pushD();
          return;
        }

        if (Object.prototype.hasOwnProperty.call(SEGMENT_POINTERS, segment)) {
          const base = SEGMENT_POINTERS[segment];
          this.emit(`@${base}`, "D=M", `@${index}`, "D=D+A", "@R13", "M=D");
          this.popToD();
          this.emit("@R13", "A=M", "M=D");
        } else if (segment === "temp") {
          this.popToD();
          this.emit(`@${5 + index}`, "M=D");
        } else if (segment === "pointer") {
          const target = index === 0 ? "THIS" : "THAT";
          this.popToD();
          this.emit(`@${target}`, "M=D");
        } else if (segment === "static") {
          this.popToD();
          this.emit(`@${this.fileName}.${index}`, "M=D");
        } else {
          throw new Error(`Cannot pop to segment: ${segment}`);
        }
      }

      writeLabel(label) {
        this.emit(`// label ${label}`, `(${this.scopedLabel(label)})`);
      }

      writeGoto(label) {
        this.emit(`// goto ${label}`, `@${this.scopedLabel(label)}`, "0;JMP");
      }

      writeIf(label) {
        this.emit(`// if-goto ${label}`);
        this.popToD();
        this.emit(`@${this.scopedLabel(label)}`, "D;JNE");
      }

      writeFunction(functionName, localCount) {
        this.currentFunction = functionName;
        this.emit(`// function ${functionName} ${localCount}`, `(${functionName})`);
        for (let i = 0; i < localCount; i += 1) {
          this.emit("@SP", "A=M", "M=0", "@SP", "M=M+1");
        }
      }

      writeCall(functionName, argCount) {
        const caller = this.currentFunction || "BOOT";
        const returnLabel = `${caller}$ret.${this.retCounter++}`;

        this.emit(`// call ${functionName} ${argCount}`);
        this.emit(`@${returnLabel}`, "D=A");
        this.pushD();

        for (const pointer of ["LCL", "ARG", "THIS", "THAT"]) {
          this.emit(`@${pointer}`, "D=M");
          this.pushD();
        }

        this.emit("@SP", "D=M", `@${5 + argCount}`, "D=D-A", "@ARG", "M=D");
        this.emit("@SP", "D=M", "@LCL", "M=D");
        this.emit(`@${functionName}`, "0;JMP", `(${returnLabel})`);
      }

      writeReturn() {
        this.emit("// return");
        this.emit("@LCL", "D=M", "@R13", "M=D");
        this.emit("@5", "A=D-A", "D=M", "@R14", "M=D");
        this.popToD();
        this.emit("@ARG", "A=M", "M=D");
        this.emit("@ARG", "D=M+1", "@SP", "M=D");
        for (const [offset, pointer] of [[1, "THAT"], [2, "THIS"], [3, "ARG"], [4, "LCL"]]) {
          this.emit("@R13", "D=M", `@${offset}`, "A=D-A", "D=M", `@${pointer}`, "M=D");
        }
        this.emit("@R14", "A=M", "0;JMP");
      }
    }

    function translateVmText(text, writer) {
      const parser = new Parser(text);
      while (parser.hasMoreLines()) {
        parser.advance();
        const type = parser.commandType();
        if (type === C_ARITHMETIC) {
          writer.writeArithmetic(parser.arg1());
        } else if (type === C_PUSH || type === C_POP) {
          writer.writePushPop(type, parser.arg1(), parser.arg2());
        } else if (type === C_LABEL) {
          writer.writeLabel(parser.arg1());
        } else if (type === C_GOTO) {
          writer.writeGoto(parser.arg1());
        } else if (type === C_IF) {
          writer.writeIf(parser.arg1());
        } else if (type === C_FUNCTION) {
          writer.writeFunction(parser.arg1(), parser.arg2());
        } else if (type === C_CALL) {
          writer.writeCall(parser.arg1(), parser.arg2());
        } else if (type === C_RETURN) {
          writer.writeReturn();
        }
      }
    }

    function translateFiles(files, bootstrap = false) {
      const writer = new CodeWriter({ bootstrap });
      for (const file of files) {
        writer.setFileName(file.name);
        translateVmText(file.text, writer);
      }
      return writer.asm();
    }

    window.VMTranslator = { translateFiles, translateVmText, CodeWriter, Parser };

    const fileInput = document.getElementById("file-input");
    const dropZone = document.getElementById("drop-zone");
    const vmText = document.getElementById("vm-text");
    const fileNameInput = document.getElementById("file-name");
    const bootstrapInput = document.getElementById("bootstrap");
    const translateButton = document.getElementById("translate-button");
    const output = document.getElementById("output");
    const copyButton = document.getElementById("copy-button");
    const downloadButton = document.getElementById("download-button");
    const statusText = document.getElementById("status");
    const errorText = document.getElementById("error");

    let loadedFiles = null;
    let textEdited = false;

    function stem(name) {
      return (name || "Main.vm").replace(/\.[^.]*$/, "");
    }

    function lineCount(text) {
      return text ? text.trimEnd().split("\n").length : 0;
    }

    function showError(message) {
      errorText.textContent = message;
      errorText.hidden = !message;
    }

    function currentFiles() {
      if (loadedFiles && !textEdited) {
        return loadedFiles;
      }
      return [{ name: fileNameInput.value || "Main.vm", text: vmText.value }];
    }

    function outputName() {
      if (loadedFiles && !textEdited) {
        return loadedFiles.length === 1 ? `${stem(loadedFiles[0].name)}.asm` : "program.asm";
      }
      return `${stem(fileNameInput.value)}.asm`;
    }

    function translate() {
      showError("");
      const files = currentFiles().filter((file) => file.text.trim());
      if (!files.length) {
        output.value = "";
        statusText.textContent = "請輸入或上傳 .vm 程式";
        return;
      }
      try {
        const asm = VMTranslator.translateFiles(files, bootstrapInput.checked);
        output.value = asm;
        statusText.textContent = `產生 ${lineCount(asm)} 行 Hack assembly`;
      } catch (error) {
        output.value = "";
        statusText.textContent = "翻譯失敗";
        showError(error.message);
      }
    }

    async function readVmFiles(fileList) {
      const files = Array.from(fileList).filter((file) => file.name.toLowerCase().endsWith(".vm"));
      if (!files.length) {
        showError("請選擇 .vm 檔案");
        return [];
      }
      return Promise.all(
        files.map(async (file) => ({ name: file.name, text: await file.text() })),
      );
    }

    async function handleFiles(fileList) {
      const files = await readVmFiles(fileList);
      if (!files.length) return;
      loadedFiles = files;
      textEdited = false;
      vmText.value = files.map((file) => file.text.trimEnd()).join("\n\n");
      fileNameInput.value = files.length === 1 ? files[0].name : "program.vm";
      bootstrapInput.checked = files.length > 1;
      showError("");
      translate();
    }

    fileInput.addEventListener("change", () => handleFiles(fileInput.files));

    dropZone.addEventListener("click", () => fileInput.click());

    dropZone.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropZone.classList.add("dragging");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragging");
    });

    dropZone.addEventListener("drop", (event) => {
      event.preventDefault();
      dropZone.classList.remove("dragging");
      handleFiles(event.dataTransfer.files);
    });

    vmText.addEventListener("input", () => {
      textEdited = true;
    });

    fileNameInput.addEventListener("input", () => {
      if (loadedFiles && loadedFiles.length === 1 && !textEdited) {
        loadedFiles = [{ name: fileNameInput.value || "Main.vm", text: loadedFiles[0].text }];
      }
    });

    translateButton.addEventListener("click", translate);

    copyButton.addEventListener("click", async () => {
      if (!output.value) return;
      try {
        await navigator.clipboard.writeText(output.value);
      } catch {
        output.select();
        document.execCommand("copy");
      }
      statusText.textContent = "已複製到剪貼簿";
    });

    downloadButton.addEventListener("click", () => {
      if (!output.value) return;
      const blob = new Blob([output.value], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = outputName();
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    });

    translate();
  </script>
</body>
</html>
